name : Build and deploy 2048-game

on:
  push:
    branches: [main]
    paths:
      - "app/**"
      - ".github/workflows/deploy.yaml"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    steps:
      - name: Get the code
        uses: actions/checkout@v7

      - name: Set the image name
        run: |
          echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/2048-game" >> "$GITHUB_ENV"

      - name: Build the image
        run: docker build -t "$IMAGE:$GITHUB_SHA" ./app

      - name: Smoke test the image
        run: |
          docker run -d --name smoke -p 8080:80 "$IMAGE:$GITHUB_SHA"
          curl --fail --silent --show-error --retry 10 --retry-all-errors --retry-delay 2 -o /dev/null http://localhost:8080
          docker rm -f smoke

      - name: Log in to GHCR
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: echo "$GH_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin

      - name: Push the image
        run: |
          docker tag "$IMAGE:$GITHUB_SHA" "$IMAGE:latest"
          docker push "$IMAGE:$GITHUB_SHA"
          docker push "$IMAGE:latest"